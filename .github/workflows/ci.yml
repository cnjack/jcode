name: CI

# Quality gate: runs on every push to main and on pull requests so regressions
# are caught before they reach a release tag.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build · vet · test · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so golangci-lint's only-new-issues can diff against base.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      # registry_generated.go is generated (gitignored), so the model package
      # won't compile without it. theme generate is offline; model generate
      # fetches models.dev.
      - name: Generate code
        run: make generate

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          # Gate regressions without forcing a flag-day cleanup of the existing
          # lint debt (mostly upstream adk.AgentMiddleware deprecations). New
          # issues introduced by a PR still fail.
          only-new-issues: true

  web:
    name: Web (type-check · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: npx oxlint .

      - name: Build
        run: npx vite build
