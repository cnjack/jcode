name: CI

# Quality gate: runs on every push to main and on pull requests so regressions
# are caught before they reach a release tag.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build · vet · test · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so golangci-lint's only-new-issues can diff against base.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      # build-web (vite) is needed because internal/web embeds dist/* via
      # //go:embed — without it the whole module fails to compile.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm

      # registry_generated.go + the theme TS/CSS are generated (gitignored), and
      # internal/web/dist must exist for the go:embed. `make generate build-web`
      # produces all three. model generate fetches models.dev; theme is offline.
      - name: Generate code + build frontend
        run: make generate build-web

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          # Gate regressions without forcing a flag-day cleanup of the existing
          # lint debt (mostly upstream adk.AgentMiddleware deprecations). New
          # issues introduced by a PR still fail.
          #
          # We compute "new issues" locally with --new-from-rev instead of the
          # action's only-new-issues flag: the latter fetches the PR diff from
          # GitHub's API, which rejects diffs over 20k lines (this repo's
          # generated registry + frontend churn exceed that). --new-from-rev
          # diffs against the local origin/main checkout (fetch-depth: 0), so it
          # has no line limit. On pushes to main, new-from-rev is empty ⇒ a full
          # run; that path doesn't run because pushes target main directly and
          # the gate is meant for PRs.
          args: ${{ github.event_name == 'pull_request' && '--new-from-rev=origin/main' || '' }}

  web:
    name: Web (type-check · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Go is needed only to run the theme generator, which writes
      # web/src/lib/themes.generated.ts + styles/tokens.generated.css
      # (gitignored) — without them tsc can't resolve the theme registry.
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Generate theme assets
        run: go generate ./internal/theme/...

      - name: Install monorepo deps
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build packages
        run: |
          cd packages/jcode-ui-core && npx tsc -p tsconfig.build.json
          cd ../jcode-ui && npx tsc -p tsconfig.build.json
          npx tailwindcss -i src/styles/entry.css -o dist/styles.css --minify

      - name: Type-check web app
        working-directory: web
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build web app
        working-directory: web
        run: npx vite build
