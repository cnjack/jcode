name: CI

# Quality gate: runs on every push to main and on pull requests so regressions
# are caught before they reach a release tag.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build · vet · test · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so golangci-lint's only-new-issues can diff against base.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      # build-web (vite) is needed because internal/web embeds dist/* via
      # //go:embed — without it the whole module fails to compile.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm

      # registry_generated.go + the theme TS/CSS are generated (gitignored), and
      # internal/web/dist must exist for the go:embed. `make generate build-web`
      # produces all three. model generate fetches models.dev; theme is offline.
      - name: Generate code + build frontend
        run: make generate build-web

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # jcode_eval replaces the native computer-use daemon with the recorded
      # fixture used by the real agent evaluation harness. Keep this tagged
      # build in CI so production-only edits cannot silently break eval runs.
      - name: Build and test jcode_eval
        env:
          CGO_ENABLED: 0
        run: |
          go build -tags jcode_eval -o /tmp/jcode-eval ./cmd/jcode
          go test -tags jcode_eval ./internal/command

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned: `latest` floated v2.12.2 -> v2.13.1 between Aug 19 and Aug 24
          # 2026, and the new staticcheck turned pre-existing test-file debt into
          # red push-to-main runs. PR runs diff with --new-from-rev (old issues
          # hidden), so only the main full-run feels toolchain drift — pin it.
          version: v2.13.1
          # Gate regressions without forcing a flag-day cleanup of the existing
          # lint debt (mostly upstream adk.AgentMiddleware deprecations). New
          # issues introduced by a PR still fail.
          #
          # We compute "new issues" locally with --new-from-rev instead of the
          # action's only-new-issues flag: the latter fetches the PR diff from
          # GitHub's API, which rejects diffs over 20k lines (this repo's
          # generated registry + frontend churn exceed that). --new-from-rev
          # diffs against the local origin/main checkout (fetch-depth: 0), so it
          # has no line limit. On pushes to main, new-from-rev is empty ⇒ a full
          # run; that path doesn't run because pushes target main directly and
          # the gate is meant for PRs.
          args: ${{ github.event_name == 'pull_request' && '--new-from-rev=origin/main' || '' }}

  computer-use-macos:
    name: Computer Use (Swift · smoke)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      # Release builds compile both architectures. Type-check both here as the
      # PR gate, then build the runner-native pair for protocol/auth/idle tests
      # that require neither Accessibility nor Screen Recording permission.
      - name: Type-check Swift helpers for both macOS architectures
        run: |
          for target in arm64-apple-macos14.0 x86_64-apple-macos14.0; do
            swiftc -typecheck -target "$target" ./cmd/jcode-computerd/main.swift
            swiftc -typecheck -target "$target" ./cmd/jcode-computerd/WindowCaptureHelper.swift
          done

      - name: Build native Swift helpers
        run: |
          case "$(uname -m)" in
            arm64) target="arm64-apple-macos14.0" ;;
            x86_64) target="x86_64-apple-macos14.0" ;;
            *) echo "unsupported macOS runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          swiftc -O -target "$target" -o /tmp/jcode-computerd-capture ./cmd/jcode-computerd/WindowCaptureHelper.swift
          swiftc -O -target "$target" -o /tmp/jcode-computerd ./cmd/jcode-computerd/main.swift
          for helper in /tmp/jcode-computerd /tmp/jcode-computerd-capture; do
            minos="$(vtool -show-build "$helper" | awk '$1 == "minos" { print $2 }')"
            [ "$minos" = "14.0" ] || { echo "$helper has unexpected minos $minos" >&2; exit 1; }
          done

      - name: Run no-TCC daemon protocol and lifecycle smoke tests
        env:
          JCODE_COMPUTERD_SMOKE: '1'
          JCODE_COMPUTERD_BIN: /tmp/jcode-computerd
        run: >-
          go test ./internal/computer
          -run 'TestSmokeSwiftDaemonHandshake$|TestSmokeSwiftDaemonRejectsBadToken$|TestSmokeDaemonIdleExit$'
          -count=1 -v

  web:
    name: Web (type-check · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Go is needed only to run the theme generator, which writes
      # web/src/lib/themes.generated.ts + styles/tokens.generated.css
      # (gitignored) — without them tsc can't resolve the theme registry.
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Generate theme assets
        run: go generate ./internal/theme/...

      - name: Install monorepo deps
        run: pnpm install --frozen-lockfile || pnpm install

      # Use the packages' own build scripts — they also generate compat.css,
      # shadcn.css and copy the voice/canvas subentry styles into dist/.
      # Hand-rolling tsc+tailwind here drifts the moment a package adds a
      # build step (exactly what broke ./compat.css resolution in 0.2.0).
      - name: Build packages
        run: |
          pnpm -C packages/jcode-ui-core build
          pnpm -C packages/jcode-ui build

      - name: Run frontend regression tests
        run: |
          node --experimental-strip-types --test packages/jcode-ui-core/src/timeline/*.test.ts
          pnpm -C packages/jcode-ui test
          pnpm -C web test
          node --test script/generate_jcode_ui_api_docs.test.mjs

      - name: Type-check web app
        working-directory: web
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build web app
        working-directory: web
        run: npx vite build
