<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <style>
      .boot-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--color-background, #f7f7f4);
        color: var(--color-foreground, #171717);
        font-family: Geist, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .boot-logo {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0;
      }
      .boot-logo span:first-child,
      .boot-logo span:last-child {
        color: var(--color-muted-foreground, #8a8a84);
      }
      .boot-logo b {
        color: var(--color-primary, #ff7a00);
      }
      .boot-copy {
        color: var(--color-muted-foreground, #73736d);
        font-size: 14px;
      }
      .boot-dots {
        display: flex;
        gap: 5px;
      }
      .boot-dots span {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: var(--color-primary, #ff7a00);
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      .boot-dots span:nth-child(2) {
        animation-delay: 140ms;
      }
      .boot-dots span:nth-child(3) {
        animation-delay: 280ms;
      }
      @keyframes boot-pulse {
        0%, 80%, 100% { opacity: .32; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-3px); }
      }
      @media (prefers-color-scheme: dark) {
        .boot-screen {
          background: var(--color-background, #111111);
          color: var(--color-foreground, #f6f6f2);
        }
      }
    </style>
    <script>
      // Pre-mount theme application to avoid a flash before Vue boots. Mirrors
      // useTheme.ts; the post-mount applyTheme() corrects any edge case using
      // the real theme registry. This runs before the module bundle, so it
      // can't import the registry: light theme ids end in "-light" and dark
      // ids do not — a convention enforced by TestLightThemeNamingConvention
      // in internal/theme, which keeps the /-light$/ check below correct.
      (function () {
        try {
          var v = localStorage.getItem('jcode_theme');
          var id;
          if (!v || v === 'system') id = matchMedia('(prefers-color-scheme: dark)').matches ? 'jcode-dark' : 'jcode-light';
          else if (v === 'dark') id = 'jcode-dark';
          else if (v === 'light') id = 'jcode-light';
          else id = v;
          var html = document.documentElement;
          html.setAttribute('data-theme', id);
          html.classList.toggle('dark', !/-light$/.test(id));
        } catch (e) {}

        // Pre-mount <html lang> application to match the stored UI locale. i18n
        // re-applies this after boot, but setting it early avoids a flash and
        // keeps screen readers / translation prompts correct from first paint.
        try {
          var map = { en: 'en', 'zh-Hans': 'zh-Hans', 'zh-Hant': 'zh-Hant', ja: 'ja', ko: 'ko' };
          var loc = localStorage.getItem('jcode_locale');
          if (!loc && navigator.languages) {
            for (var i = 0; i < navigator.languages.length; i++) {
              var l = (navigator.languages[i] || '').toLowerCase();
              if (l === 'zh' || l.indexOf('zh-cn') === 0 || l.indexOf('zh-sg') === 0 || l.indexOf('zh-hans') === 0) { loc = 'zh-Hans'; break; }
              if (l.indexOf('zh-tw') === 0 || l.indexOf('zh-hk') === 0 || l.indexOf('zh-mo') === 0 || l.indexOf('zh-hant') === 0) { loc = 'zh-Hant'; break; }
              var p = l.split('-')[0];
              if (p === 'ja') { loc = 'ja'; break; }
              if (p === 'ko') { loc = 'ko'; break; }
              if (p === 'en') { loc = 'en'; break; }
            }
          }
          if (loc && map[loc]) document.documentElement.lang = map[loc];
        } catch (e) {}
      })();
    </script>
    <title>JCODE — Coding Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="background: var(--color-background); color: var(--color-foreground);" class="antialiased">
    <div id="app">
      <div class="boot-screen" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-logo"><span>[</span><b>J</b>CODE<span>]</span></div>
          <div class="boot-copy">Starting local server...</div>
          <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
