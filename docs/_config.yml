title: jcode
description: "jcode — Your AI Coding Companion. An intelligent coding agent that lives in your terminal."
tagline: "Think it. Code it."
url: "https://cnjack.github.io"
baseurl: "/jcode"

theme: just-the-docs

color_scheme: light

# Enable light/dark theme toggle
enable_copy_code_button: true
color_scheme_toggle: true
dark_scheme: dark

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

nav_enabled: true
nav_sort: case_sensitive

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"
back_to_top_sort: 100

plugins:
  - jemoji

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      nav_order: 999

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: purple
