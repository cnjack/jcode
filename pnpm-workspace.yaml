# Root pnpm workspace for the product UI + reusable component library.
#
# Members:
#   - packages/jcode-ui       : published React component library (styled)
#   - packages/jcode-ui-core  : framework-agnostic core (types, runtime, primitives)
#   - web                     : React product app (embedded in the Go binary / Tauri)
#
# site/ (marketing + docs) keeps its own workspace and is NOT a member here.
packages:
  - 'packages/*'
  - 'web'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
# Native build scripts to allow. esbuild (Vite's bundler) and @parcel/watcher
# (dev-server file watching) are trusted toolchain deps — whitelisting them
# avoids ERR_PNPM_IGNORED_BUILDS failing `pnpm install` (and the Makefile build).
onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
