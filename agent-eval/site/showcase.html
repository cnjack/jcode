<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showcase — jcode</title>
  <meta name="description" content="Self-contained frontend apps generated by jcode: dashboard, todo, pricing calculator, canvas particles, SVG charts, and landing page." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d0d0d'/%3E%3Ctext x='50' y='68' font-size='52' fill='%23f6f3ec' text-anchor='middle' font-family='Georgia'%3Ej%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark">j</span>
        jcode
      </a>
      <ul class="nav-links">
        <li><a href="index.html#features">Features</a></li>
        <li><a href="index.html#desktop">Desktop</a></li>
        <li><a href="index.html#cli">CLI</a></li>
        <li><a href="showcase.html" class="active">Showcase</a></li>
        <li><a href="docs/">Docs</a></li>
      </ul>
      <a class="nav-cta" href="https://github.com/cnjack/jcode" target="_blank">GitHub</a>
    </div>
  </nav>

  <header class="hero" style="padding-bottom: 24px;">
    <span class="hero-label">Showcase</span>
    <h1>What jcode can <em>ship</em></h1>
    <p class="mb-0">
      Six single-file, self-contained frontend apps generated by jcode. Each demo
      can be maximized or opened in a new window.
    </p>
  </header>

  <section class="compact">
    <div id="projects">
      <!-- Populated by JS below -->
    </div>
  </section>

  <div class="modal-overlay" id="demoModal" aria-hidden="true">
    <div class="modal-bar">
      <h3 id="modalTitle">Demo</h3>
      <div class="modal-actions">
        <a id="modalOpen" href="#" target="_blank">Open in new window ↗</a>
        <button class="close" onclick="closeModal()">Close</button>
      </div>
    </div>
    <iframe class="modal-frame" id="modalFrame" src="" title=""></iframe>
  </div>

  <footer>
    <p>
      <a href="https://github.com/cnjack/jcode" target="_blank">GitHub</a> ·
      <a href="docs/">Documentation</a> ·
      <a href="index.html">Home</a>
    </p>
    <p style="margin-top:10px;font-size:.85rem;color:var(--muted);">津ICP备13004281号-4</p>
  </footer>

  <script src="js/site.js"></script>
  <script>
    const PROJECTS = [
      { id: 'fe_analytics_dashboard', title: 'Analytics Dashboard', desc: 'Dark KPI dashboard with four stat cards, inline SVG bar and area charts, plus a usage donut and customer table.' },
      { id: 'fe_landing_hero', title: 'Product Landing Page', desc: 'Marketing hero for a fictional dev tool called Nimbus — nav, hero, CTAs, and three feature cards.' },
      { id: 'fe_todo_app', title: 'To-Do App', desc: 'Vanilla-JS task list with add/complete/delete, All/Active/Completed filters, and localStorage persistence.' },
      { id: 'fe_pricing_calculator', title: 'Pricing Calculator', desc: 'Interactive seat slider (1–100) with monthly/annual toggle and live total. Annual billing applies a 20% discount.' },
      { id: 'fe_canvas_particles', title: 'Canvas Particle Hero', desc: 'Animated particle network rendered on HTML5 canvas with requestAnimationFrame. Canvas resizes with the window.' },
      { id: 'fe_svg_dataviz', title: 'SVG Donut Chart', desc: 'Browser-market-share donut chart and legend computed from inline data: Chrome 63%, Safari 20%, Firefox 5%, Edge 5%, Other 7%.' }
    ];

    function openModal(id, title) {
      const modal = document.getElementById('demoModal');
      const frame = document.getElementById('modalFrame');
      const openLink = document.getElementById('modalOpen');
      document.getElementById('modalTitle').textContent = title;
      frame.src = 'projects/' + id + '/index.html';
      openLink.href = 'projects/' + id + '/index.html';
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('demoModal');
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.getElementById('modalFrame').src = '';
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    document.getElementById('projects').innerHTML = PROJECTS.map(p => `
      <article class="project">
        <div class="project-header">
          <div>
            <h3>${p.title}</h3>
            <p>${p.desc}</p>
          </div>
          <div class="project-meta">
            <button class="btn btn-primary" onclick="openModal('${p.id}', '${p.title}')">Maximize</button>
            <a class="btn btn-secondary" href="projects/${p.id}/index.html" target="_blank">Open ↗</a>
          </div>
        </div>
        <iframe class="project-frame" src="projects/${p.id}/index.html" title="${p.title}" loading="lazy"></iframe>
      </article>
    `).join('');
  </script>
</body>
</html>
