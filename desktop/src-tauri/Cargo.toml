[package]
name = "jcode-desktop"
version = "0.5.3"
description = "jcode desktop — native shell around the embedded jcode web app"
authors = ["cnjack"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only plugins (no Android/iOS support).
# The updater requires the `plugins.updater` config (endpoints + pubkey) in
# tauri.conf.json — it is present. `bundle.createUpdaterArtifacts` is,
# however, deliberately left out of the committed conf: with it set, every
# `tauri build` needs TAURI_SIGNING_PRIVATE_KEY or it hard-fails, which would
# break local `make desktop-build`. CI enables it per-build (release.yml).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
icns = { version = "0.4", default-features = false, features = ["pngio"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
plist = "1"

[target.'cfg(target_os = "linux")'.dependencies]
shlex = "1.3"

[target.'cfg(target_os = "windows")'.dependencies]
png = "0.18"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
