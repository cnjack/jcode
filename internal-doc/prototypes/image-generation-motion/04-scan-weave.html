<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>方案 04 · 扫描织网</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f3f0;
      --surface: #fbfbf8;
      --ink: #1d1d1a;
      --muted: #76766f;
      --hairline: #d2d2cb;
      --field: #ecece8;
      --line: #96968f;
      --signal: #f06a2a;
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: var(--ink); background: var(--paper); }

    main {
      display: grid;
      min-height: 100vh;
      grid-template-columns: minmax(18rem, 28rem) minmax(0, 1fr);
    }

    aside {
      display: flex;
      flex-direction: column;
      padding: clamp(2rem, 6vw, 5rem);
      border-right: 1px solid var(--hairline);
      background: var(--surface);
    }

    .back { color: var(--muted); font-family: "SFMono-Regular", Consolas, monospace; font-size: .72rem; text-decoration: none; }
    .back:hover { color: var(--ink); }
    .kicker { margin-top: auto; color: var(--signal); font-family: "SFMono-Regular", Consolas, monospace; font-size: .72rem; letter-spacing: .14em; }
    h1 { margin: 1rem 0 .8rem; font-size: clamp(2.4rem, 5vw, 4.6rem); font-weight: 620; letter-spacing: -.06em; line-height: .95; }
    .description { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.8; }
    .note { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--hairline); color: var(--muted); font-family: "SFMono-Regular", Consolas, monospace; font-size: .7rem; line-height: 1.7; }

    .lab { display: grid; min-height: 100vh; place-items: center; padding: 2rem; }
    .lab__inner { display: flex; width: min(48rem, 100%); flex-direction: column; align-items: center; gap: 2rem; }

    .image-card {
      position: relative;
      width: var(--card-width, 16rem);
      aspect-ratio: var(--card-ratio, 1);
      overflow: hidden;
      border: 1px solid #c9c9c2;
      border-radius: 1.1rem;
      background: var(--field);
      box-shadow: 0 1px 2px rgb(25 25 22 / 7%), inset 0 1px 0 rgb(255 255 255 / 80%);
      contain: paint;
      transition: width .45s cubic-bezier(.2,.8,.2,1), aspect-ratio .45s cubic-bezier(.2,.8,.2,1);
    }

    .mesh { position: absolute; inset: 18%; }
    .rail { position: absolute; display: block; background: var(--line); opacity: .1; will-change: transform, opacity; }
    .rail--x { left: 0; width: 100%; height: 1px; top: calc((var(--i) + 1) * 11.1%); transform: scaleX(.08); animation: scan-x 3.2s cubic-bezier(.16,1,.3,1) infinite; animation-delay: calc(var(--i) * -90ms); }
    .rail--y { top: 0; height: 100%; width: 1px; left: calc((var(--i) + 1) * 11.1%); transform: scaleY(.08); animation: scan-y 3.2s cubic-bezier(.16,1,.3,1) infinite; animation-delay: calc(var(--i) * -90ms - 420ms); }

    .image-card[data-state="saving"] .rail { animation-duration: 4.6s; }
    .image-card[data-state="saving"] .rail--x { animation-name: settle-x; }
    .image-card[data-state="saving"] .rail--y { animation-name: settle-y; }

    .node {
      position: absolute;
      left: calc((var(--x) + 1) * 11.1%);
      top: calc((var(--y) + 1) * 11.1%);
      width: .28rem;
      height: .28rem;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      opacity: .08;
      transform: translate(-50%, -50%) scale(.4);
      animation: node 3.2s ease-in-out infinite;
      animation-delay: calc((var(--x) + var(--y)) * -80ms);
    }

    .image-card[data-state="saving"] .node { animation-duration: 4.6s; }
    .status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem 1.5rem; }
    .control { display: flex; align-items: center; gap: .35rem; padding: .3rem; border: 1px solid var(--hairline); border-radius: 999px; background: var(--surface); }
    .control span { padding-left: .55rem; color: var(--muted); font-family: "SFMono-Regular", Consolas, monospace; font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; }
    button { min-height: 2.15rem; padding: 0 .8rem; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-size: .76rem; cursor: pointer; }
    button:hover { color: var(--ink); background: #eeeeea; }
    button[aria-pressed="true"] { color: var(--surface); background: var(--ink); }
    button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

    @keyframes scan-x { 0%,100% { opacity:.06; transform:scaleX(.08) } 42%,65% { opacity:.58; transform:scaleX(1) } 84% { opacity:.14; transform:scaleX(.34) } }
    @keyframes scan-y { 0%,100% { opacity:.06; transform:scaleY(.08) } 42%,65% { opacity:.58; transform:scaleY(1) } 84% { opacity:.14; transform:scaleY(.34) } }
    @keyframes settle-x { 0%,100% { opacity:.22; transform:scaleX(.72) } 48%,70% { opacity:.5; transform:scaleX(1) } }
    @keyframes settle-y { 0%,100% { opacity:.22; transform:scaleY(.72) } 48%,70% { opacity:.5; transform:scaleY(1) } }
    @keyframes node { 0%,100% { opacity:.06; transform:translate(-50%,-50%) scale(.4) } 50%,68% { opacity:.62; transform:translate(-50%,-50%) scale(1) } }

    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      aside { min-height: auto; padding: 2rem; border-right: 0; border-bottom: 1px solid var(--hairline); }
      .kicker { margin-top: 3rem; }
      .lab { min-height: 34rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .rail { opacity: .35; transform: none; }
      .node { opacity: .45; transform: translate(-50%,-50%); }
    }
  </style>
</head>
<body>
  <main>
    <aside>
      <a class="back" href="index.html">← 返回全部方案</a>
      <div class="kicker">04 / TECHNICAL</div>
      <h1>扫描织网</h1>
      <p class="description">横纵信号线从不同方向逐次接通，在中心织成一张稳定网格。生成态更活跃；保存态减速并保持完整结构。</p>
      <p class="note">CARD: 12 / 16 / 18 REM<br>MOTION: TRANSFORM + OPACITY<br>VISIBLE COPY INSIDE CARD: NONE</p>
    </aside>

    <section class="lab" aria-label="扫描织网动效实验台">
      <div class="lab__inner">
        <div class="image-card" data-state="generating" role="img" aria-label="正在生成图片" aria-busy="true">
          <div class="mesh" aria-hidden="true">
            <i class="rail rail--x" style="--i:0"></i><i class="rail rail--x" style="--i:1"></i><i class="rail rail--x" style="--i:2"></i><i class="rail rail--x" style="--i:3"></i><i class="rail rail--x" style="--i:4"></i><i class="rail rail--x" style="--i:5"></i><i class="rail rail--x" style="--i:6"></i><i class="rail rail--x" style="--i:7"></i>
            <i class="rail rail--y" style="--i:0"></i><i class="rail rail--y" style="--i:1"></i><i class="rail rail--y" style="--i:2"></i><i class="rail rail--y" style="--i:3"></i><i class="rail rail--y" style="--i:4"></i><i class="rail rail--y" style="--i:5"></i><i class="rail rail--y" style="--i:6"></i><i class="rail rail--y" style="--i:7"></i>
            <i class="node" style="--x:1;--y:1"></i><i class="node" style="--x:3;--y:2"></i><i class="node" style="--x:5;--y:1"></i><i class="node" style="--x:6;--y:4"></i><i class="node" style="--x:2;--y:5"></i><i class="node" style="--x:4;--y:6"></i>
          </div>
          <span class="status" role="status" aria-live="polite">正在生成</span>
        </div>

        <div class="controls">
          <div class="control" data-control="state"><span>状态</span><button aria-pressed="true" data-value="generating">生成</button><button aria-pressed="false" data-value="saving">保存</button></div>
          <div class="control" data-control="ratio"><span>比例</span><button aria-pressed="false" data-value="portrait">竖图</button><button aria-pressed="true" data-value="square">方图</button><button aria-pressed="false" data-value="landscape">横图</button></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const card = document.querySelector('.image-card')
    const status = card.querySelector('.status')
    const ratios = {
      portrait: ['12rem', '9 / 16'],
      square: ['16rem', '1'],
      landscape: ['18rem', '16 / 9'],
    }

    document.querySelectorAll('.control button').forEach((button) => {
      button.addEventListener('click', () => {
        const group = button.closest('.control')
        group.querySelectorAll('button').forEach((item) => item.setAttribute('aria-pressed', String(item === button)))
        if (group.dataset.control === 'state') {
          card.dataset.state = button.dataset.value
          status.textContent = button.dataset.value === 'saving' ? '正在保存' : '正在生成'
        } else {
          const [width, ratio] = ratios[button.dataset.value]
          card.style.setProperty('--card-width', width)
          card.style.setProperty('--card-ratio', ratio)
        }
      })
    })
  </script>
</body>
</html>
